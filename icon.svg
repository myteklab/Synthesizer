<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="synthBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8e44ad"/>
      <stop offset="50%" style="stop-color:#9b59b6"/>
      <stop offset="100%" style="stop-color:#3498db"/>
    </linearGradient>
    <linearGradient id="knobShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a4a5a"/>
      <stop offset="100%" style="stop-color:#1a1a2a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="18" fill="url(#synthBg)"/>

  <!-- Panel background -->
  <rect x="8" y="8" width="84" height="84" rx="12" fill="rgba(0,0,0,0.3)"/>

  <!-- Waveform display area -->
  <rect x="12" y="12" width="76" height="24" rx="4" fill="rgba(0,0,0,0.5)"/>

  <!-- Animated waveform -->
  <path d="M16,24 Q22,14 28,24 T40,24 T52,24 T64,24 T76,24 T84,24"
        stroke="#00ff88" stroke-width="2" fill="none" filter="url(#glow)"/>

  <!-- Knobs row -->
  <g>
    <!-- Knob 1 -->
    <circle cx="24" cy="48" r="9" fill="url(#knobShine)" stroke="#666" stroke-width="1"/>
    <circle cx="24" cy="48" r="6" fill="none" stroke="#444" stroke-width="1"/>
    <line x1="24" y1="48" x2="24" y2="40" stroke="#9b59b6" stroke-width="2" stroke-linecap="round"/>

    <!-- Knob 2 -->
    <circle cx="50" cy="48" r="9" fill="url(#knobShine)" stroke="#666" stroke-width="1"/>
    <circle cx="50" cy="48" r="6" fill="none" stroke="#444" stroke-width="1"/>
    <line x1="50" y1="48" x2="56" y2="43" stroke="#3498db" stroke-width="2" stroke-linecap="round"/>

    <!-- Knob 3 -->
    <circle cx="76" cy="48" r="9" fill="url(#knobShine)" stroke="#666" stroke-width="1"/>
    <circle cx="76" cy="48" r="6" fill="none" stroke="#444" stroke-width="1"/>
    <line x1="76" y1="48" x2="82" y2="52" stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Keyboard -->
  <g>
    <!-- White keys -->
    <rect x="12" y="62" width="11" height="28" rx="2" fill="#f5f5f5" stroke="#ddd" stroke-width="0.5"/>
    <rect x="24" y="62" width="11" height="28" rx="2" fill="#f5f5f5" stroke="#ddd" stroke-width="0.5"/>
    <rect x="36" y="62" width="11" height="28" rx="2" fill="#f5f5f5" stroke="#ddd" stroke-width="0.5"/>
    <rect x="48" y="62" width="11" height="28" rx="2" fill="#f5f5f5" stroke="#ddd" stroke-width="0.5"/>
    <rect x="60" y="62" width="11" height="28" rx="2" fill="#f5f5f5" stroke="#ddd" stroke-width="0.5"/>
    <rect x="72" y="62" width="11" height="28" rx="2" fill="#f5f5f5" stroke="#ddd" stroke-width="0.5"/>

    <!-- Active key highlight -->
    <rect x="36" y="62" width="11" height="28" rx="2" fill="#c084fc" stroke="#a855f7" stroke-width="0.5"/>

    <!-- Black keys -->
    <rect x="19" y="62" width="8" height="17" rx="1" fill="#1a1a2e"/>
    <rect x="31" y="62" width="8" height="17" rx="1" fill="#1a1a2e"/>
    <rect x="55" y="62" width="8" height="17" rx="1" fill="#7c3aed"/>
    <rect x="67" y="62" width="8" height="17" rx="1" fill="#1a1a2e"/>
  </g>
</svg>
